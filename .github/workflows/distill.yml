name: IA – Destilar promociones (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Ejecutar motor IA (genera web/data.json)
        run: python ai_engine.py --data-dir data --out-json web/data.json

      - name: Ejecutar IA Smart (canasta básica → web/data_smart.json)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python ia_smart.py --data-dir data --data-json web/data.json --out-json web/data_smart.json

      - name: Commit data.json y data_smart.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/
          git commit -m "🤖 IA: promociones destiladas $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push