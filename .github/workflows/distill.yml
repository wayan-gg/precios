name: IA – Destilar promociones (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar motor IA (genera web/data.json)
        run: python ai_engine.py --data-dir data --out-json web/data.json

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          git commit -m "🤖 IA: promociones destiladas $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push