name: Scrape y publicar promociones (Panamá)

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Timeout global del job

    steps:
      - name: Instalar Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas openpyxl beautifulsoup4 lxml selenium webdriver-manager

      - name: Ejecutar Scraper
        run: python scraper_super.py

      - name: Ejecutar AI Engine
        run: python ai_engine.py

      - name: Listar archivos generados
        run: |
          echo "=== Archivos en data/ ==="
          ls -la data/ || echo "data/ no existe"
          echo "=== Archivos en web/ ==="
          ls -la web/ || echo "web/ no existe"

      - name: Commit y Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ web/data.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualización automática de precios y data.json"
            git push
          else
            echo "No hay cambios nuevos para commitar."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4
