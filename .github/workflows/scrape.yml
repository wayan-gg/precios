name: Scrape y publicar promociones (Panamá)

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ==============================================
      # 1. CHECKOUT (sin LFS para evitar problemas)
      # ==============================================
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ==============================================
      # 2. INSTALAR CHROME CON LA ACCIÓN OFICIAL
      # ==============================================
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Verificar Chrome
        run: chrome --version

      # ==============================================
      # 3. CONFIGURAR PYTHON
      # ==============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ==============================================
      # 4. INSTALAR DEPENDENCIAS DE PYTHON
      # ==============================================
      - name: Instalar dependencias Python
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas openpyxl beautifulsoup4 lxml selenium webdriver-manager
          fi

      # ==============================================
      # 5. EJECUTAR SCRAPER (CON WEBDRIVER_MANAGER)
      # ==============================================
      - name: Ejecutar Scraper
        run: python scraper_super.py

      # ==============================================
      # 6. EJECUTAR MOTOR IA
      # ==============================================
      - name: Ejecutar Motor AI Engine
        run: python ai_engine.py

      # ==============================================
      # 7. LISTAR ARCHIVOS GENERADOS
      # ==============================================
      - name: Listar archivos generados
        run: |
          echo "=== Archivos en data/ ==="
          ls -la data/ || echo "data/ no existe"
          echo "=== Archivos en web/ ==="
          ls -la web/ || echo "web/ no existe"

      # ==============================================
      # 8. COMMIT Y PUSH DE ARCHIVOS GENERADOS
      # ==============================================
      - name: Commit y Push de archivos generados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ web/data.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualización automática de precios y data.json"
            git push
          else
            echo "No hay cambios nuevos para commitar."
          fi

      # ==============================================
      # 9. CONFIGURAR Y DESPLEGAR EN GITHUB PAGES
      # ==============================================
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (carpeta web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
