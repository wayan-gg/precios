name: Scraper diario (solo datos)

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 y 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache ChromeDriver
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: chromedriver-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable >/dev/null

      - name: Run scraper (solo CSVs)
        run: python scraper_super.py --max-pages 20

      - name: Commit CSVs actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "📦 Actualización CSVs $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push

      - name: Upload Pages artifact (solo web estático, SIN data.json)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          # Nota: data.json NO se sube aquí; se genera en workflow separado "IA manual"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4