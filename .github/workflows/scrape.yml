    steps:
      # ------------ PREVENCIÓN DEL ERROR DE POST CHECKOUT ------------
      - name: Instalar Git LFS (Previene el error de Post Checkout)
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      # ------------ TUS PASOS DE EJECUCIÓN (YA SIN EL DE DEPENDENCIAS) ------------
      
      - name: Ejecutar Scraper
        run: |
          # Asegúrate de poner el comando exacto que ejecuta tu scraper
          # Ejemplo: python scraper.py o node scraper.js
          python scraper.py 

      - name: Ejecutar Motor AI Engine
        run: |
          # Asegúrate de poner el comando exacto que ejecuta tu motor de IA
          # Ejemplo: python ai_engine.py o node engine.js
          python ai_engine.py

      - name: Listar archivos generados
        run: ls -la

      - name: Commit y Push de archivos generados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualización automática de datos"
            git push
          else
            echo "No hay cambios nuevos para commitar."
          fi

      # ------------ CONFIGURACIÓN PARA DESPLEGAR ------------
      
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (carpeta web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # CAMBIA ESTO POR LA CARPETA QUE SUBES A LA WEB

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
