name: Scraper and Deploy

on:
  schedule:
    # Cambia este cron según quieras que se ejecute. 
    # El ejemplo es todos los días a las 00:00 (UTC)
    - cron: '0 0 * * *' 
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

permissions:
  contents: write # Necesario para que pueda hacer push de los archivos generados
  pages: write    # Necesario si haces deploy a GitHub Pages
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ------------ INICIO DE LA CORRECCIÓN DEL ERROR ------------
      - name: Instalar Git LFS (Previene el error de Post Checkout)
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Checkout repositorio
        uses: actions/checkout@v4  # ¡Actualizado a la v4 para evitar errores de Node 20!
        with:
          lfs: true
          persist-credentials: true # Necesario si usarás 'git push' más adelante
      # ------------ FIN DE LA CORRECCIÓN DEL ERROR ------------


      # ------------ AQUÍ PEGA TUS PROPIOS PASOS ------------
      
      - name: Instalar dependencias
        run: |
          # Ejemplo si usas Python:
          pip install -r requirements.txt
          # Ejemplo si usas Node:
          # npm install

      - name: Ejecutar Scraper
        run: |
          # Aquí debe ir tu comando para ejecutar tu scraper
          # Ejemplo: python scraper.py
          echo "Ejecutando scraper..."

      - name: Ejecutar Motor AI Engine
        run: |
          # Aquí va el comando de tu AI Engine
          # Ejemplo: python ai_engine.py
          echo "Ejecutando AI Engine..."

      - name: Listar archivos generados
        run: ls -la

      - name: Commit y Push de archivos generados
        run: |
          # Este paso permite subir los datos que haya generado tu scraper
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualización automática de datos"
            git push
          else
            echo "No hay cambios nuevos para commitar."
          fi

      # ------------ CONFIGURACIÓN PARA GITHUB PAGES ------------
      
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next  # O el que uses (static, hugo, etc)

      - name: Subir artefacto (carpeta web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # CAMBIAR POR LA CARPETA QUE SUBES A LA WEB

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
